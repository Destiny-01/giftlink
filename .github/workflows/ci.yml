name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: link-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: link-backend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn prisma:generate
      - run: yarn build
      - run: yarn test
      - run: yarn test:types

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: link-gift-send
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: link-gift-send/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: link-contracts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: link-contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test
      - run: npx tsc --noEmit
      - run: npx hardhat run scripts/export-abi.ts
      # The committed ABI must match the compiled artefact.
      - run: git diff --exit-code -- abi/NomineClaimCore.json

