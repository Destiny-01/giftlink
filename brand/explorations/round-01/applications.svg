<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1710" viewBox="0 0 1440 1710" role="img" aria-label="Nomine nine application studies"><title>Nomine nine application studies</title><g font-family="Instrument Sans, Arial, sans-serif"><rect x="0" y="0" width="1440" height="1710" fill="#F3F0E9"/><text x="48" y="64" fill="#0B0B0D" font-size="44" >One identity. Different responsibilities.</text><text x="48" y="106" fill="#6B6B72" font-size="18" >Resolved Path / application studies / illustrative data / not shipped UI</text><rect x="48" y="150" width="432" height="476" fill="#0B0B0D"/><text x="72" y="185" fill="#B9B6B0" font-size="12" >LANDING PAGE</text><g transform="translate(72 212) scale(0.5)" color="#F3F0E9"><path d="M14 49V15L50 49V15" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/><circle cx="14" cy="49" r="6" fill="currentColor"/><circle cx="50" cy="15" r="6" fill="currentColor"/></g><text x="115" y="238" fill="#F3F0E9" font-size="24" >Nomine</text><text x="72" y="324" fill="#F3F0E9" font-size="36" >Value, addressed.</text><text x="72" y="406" fill="#F3F0E9" font-size="15" >Nomine makes funded value addressable and</text><text x="72" y="427" fill="#F3F0E9" font-size="15" >claimable.</text><text x="72" y="470" fill="#F3F0E9" font-size="15" >Explore the Claim lifecycle</text><text x="72" y="534" fill="#F3F0E9" font-size="15" >Built on Arc</text><rect x="504" y="150" width="432" height="476" fill="#E7E3DC"/><text x="528" y="185" fill="#6B6B72" font-size="12" >NOMINE INBOX</text><g transform="translate(528 212) scale(0.5)" color="#0B0B0D"><path d="M14 49V15L50 49V15" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/><circle cx="14" cy="49" r="6" fill="currentColor"/><circle cx="50" cy="15" r="6" fill="currentColor"/></g><text x="571" y="238" fill="#0B0B0D" font-size="24" >Nomine</text><text x="528" y="311" fill="#0B0B0D" font-size="31" >What’s yours should find</text><text x="528" y="351" fill="#0B0B0D